<div class="w-100 divh1 d-flex justify-content-center align-items-center">
    
    <!-- Burger Menu a sinistra -->
    <ul class="navbar-nav position-absolute end-0 me-4">
        <li class="nav-item dropdown">
            <!-- Rimosso 'dropdown-toggle' per togliere la freccetta e aggiunta la classe personalizzata 'burger-btn' -->
            <button class="btn burger-btn" data-bs-toggle="dropdown" aria-expanded="false" aria-label="Menu">
                <!-- Icona Burger (Tre linee) in SVG -->
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" viewBox="0 0 16 16">
                    <path fill-rule="evenodd" d="M2.5 12a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5m0-4a.5.5 0 0 1 .5-.5h10a.5.5 0 0 1 0 1H3a.5.5 0 0 1-.5-.5"/>
                </svg>
            </button>
            <ul class="dropdown-menu">
                <li><a class="dropdown-item" href="#">Dati personali</a></li>
                <li><a class="dropdown-item" href="#">Le mie prenotazioni</a></li>
                <li><a class="dropdown-item" href="#">Preferiti</a></li>
            </ul>
        </li>
    </ul>

    <!-- Logo perfettamente centrato -->
    <img src="logo-alloggi.png" class="logo" alt="Logo"/>

</div>
<div class="container p-4">

  <div class="row">

	
    <!-- INFO ALLOGGIO -->
    <div class="col-md-6">
      <div class="card shadow-sm">
		<img 
		  [src]="alloggio()?.immagini?.[0] || 'https://via.placeholder.com/400x250?text=Immagine+Non+Disponibile'" 
		  class="card-img-top" 
		  style="height:250px; object-fit:cover"
		>
        <div class="card-body">
          <h3>{{ alloggio()?.titolo }}</h3>
          <p>{{ alloggio()?.descrizione }}</p>
          <p><strong>{{ alloggio()?.citta }}</strong></p>
          <h5>{{ alloggio()?.prezzo }} € / notte</h5>
        </div>
      </div>
    </div>

    <!-- FORM PRENOTAZIONE -->
    <div class="col-md-6">

      <div class="card shadow-sm p-3">

        <h4>Prenota ora</h4>

        <!-- checkin -->
        <label>Check-in</label>
        <input type="date" class="form-control mb-2"
               [(ngModel)]="booking.data_checkin"
               (change)="calcolaPrezzo()">

        <!-- checkout -->
        <label>Check-out</label>
        <input type="date" class="form-control mb-2"
               [(ngModel)]="booking.data_checkout"
               (change)="calcolaPrezzo()">

        <!-- ospiti -->
        <label>Numero ospiti</label>
        <input type="number" class="form-control mb-2"
               [(ngModel)]="booking.num_ospiti">

        <!-- prezzo -->
        <div class="alert alert-info">
          Totale: <strong>{{ prezzoTotale }} €</strong>
        </div>

        <!-- bottone -->
        <button class="btn btn-primary w-100"
                (click)="prenota()">
          Prenota
        </button>

      </div>
    </div>

  </div>
</div>
