<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Login</title>
</head>
<body>
    <div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
  <div class="card shadow-lg" style="width: 100%; max-width: 400px; border-radius: 15px;">
    <div class="card-body p-5">
      <h2 class="text-center mb-4 fw-bold">Bentornato</h2>
      <p class="text-muted text-center mb-4">Accedi </p>

      <form (ngSubmit)="onLogin()">
        <div class="mb-3">
          <label class="form-label">Email</label>
          <input type="email" 
                 class="form-control form-control-lg" 
                 [ngModel]="email()" 
                 (ngModelChange)="email.set($event)"
                 name="email" 
                 placeholder="esempio@mail.com" 
                 required>
        </div>

        <div class="mb-4">
          <label class="form-label">Password</label>
          <input type="password" 
                 class="form-control form-control-lg" 
                 [ngModel]="password()" 
                 (ngModelChange)="password.set($event)"
                 name="password" 
                 placeholder="••••••••" 
                 required>
        </div>

        @if (errorMessage()) {
          <div class="alert alert-danger py-2 small">
            {{ errorMessage() }}
          </div>
        }

        <button type="submit" class="btn btn-primary btn-lg w-100 shadow-sm" style="border-radius: 10px;">
          Accedi
        </button>

        <div class="text-center mt-4">
          <span class="text-muted">Non hai un account?</span>
          <a href="#" class="text-primary fw-bold text-decoration-none ms-1">Registrati</a>
        </div>
      </form>
    </div>
  </div>
</div>
</body>
</html>
